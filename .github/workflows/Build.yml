name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.0' }
      - name: Unpack
        run: |
          rm -rf proj && mkdir proj && unzip -q vclient-full.zip -d proj
          echo "BUILD_DIR=$(dirname "$(find proj -maxdepth 3 -name build.gradle | head -1)")" >> $GITHUB_ENV
      - name: Build
        run: cd "$BUILD_DIR" && gradle build --no-daemon
      - name: Collect
        run: |
          mkdir -p out
          cp "$(find "$BUILD_DIR/build/libs" -name '*.jar' ! -name '*sources*' | head -1)" out/vclient-full.jar
      - uses: actions/upload-artifact@v4
        with: { name: vclient-full, path: out/vclient-full.jar }
